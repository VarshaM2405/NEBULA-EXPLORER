<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Explorer | Mission Log</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Michroma&family=Courier+Prime&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --deep-space: #050b18;
            --terminal-green: #00ff41;
        }
        body {
            font-family: 'Michroma', sans-serif;
            background-color: var(--deep-space);
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                url('background.png');
            background-size: 50px 50px, 50px 50px, cover;
            background-attachment: fixed;
            color: #e0f2fe;
            overflow-x: hidden;
            min-height: 100vh;
        }
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; }
        .terminal-font { font-family: 'Courier Prime', monospace; }
        .hud-border {
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2), inset 0 0 15px rgba(0, 243, 255, 0.1);
            background: rgba(5, 11, 24, 0.8);
            backdrop-filter: blur(10px);
        }
        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(0, 243, 255, 0.1);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            pointer-events: none;
            animation: scan 4s linear infinite;
        }
        @keyframes scan {
            from { top: -100px; }
            to { top: 100vh; }
        }
        .planet-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }
        .planet-card:hover {
            transform: scale(1.02) translateY(-5px);
            border-color: var(--neon-purple);
            box-shadow: 0 0 30px rgba(188, 19, 254, 0.3);
        }
        .glitch-text:hover {
            text-shadow: 2px 0 var(--neon-cyan), -2px 0 var(--neon-purple);
            animation: glitch 0.3s infinite;
        }
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
        .hazard-bar { height: 4px; border-radius: 2px; transition: width 1s ease-out; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 243, 255, 0.05); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--neon-cyan); }
        
        .cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background: var(--terminal-green);
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="scanline"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- IMPROVED MECHANICAL CLICK ENGINE ---
        const playMechanicalClick = (pitch = 400) => {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // Create a noise buffer for the "click" texture
                const bufferSize = audioCtx.sampleRate * 0.02;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                // Filter the noise to make it a "thud" or "click" instead of "static"
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(pitch, audioCtx.currentTime);
                filter.Q.setValueAtTime(10, audioCtx.currentTime);

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.02);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                noise.start();
                noise.stop(audioCtx.currentTime + 0.02);
            } catch (e) {
                console.warn("Audio Synthesis Failed:", e);
            }
        };

        const useInterstellarAudio = (isActive) => {
            const audioCtx = useRef(null);
            const oscillator = useRef(null);
            const filter = useRef(null);
            const gainNode = useRef(null);

            useEffect(() => {
                if (isActive) {
                    audioCtx.current = new (window.AudioContext || window.webkitAudioContext)();
                    oscillator.current = audioCtx.current.createOscillator();
                    filter.current = audioCtx.current.createBiquadFilter();
                    gainNode.current = audioCtx.current.createGain();
                    oscillator.current.type = 'sawtooth';
                    filter.current.type = 'lowpass';
                    filter.current.frequency.value = 440;
                    gainNode.current.gain.value = 0.02;
                    oscillator.current.connect(filter.current);
                    filter.current.connect(gainNode.current);
                    gainNode.current.connect(audioCtx.current.destination);
                    oscillator.current.start();
                } else {
                    if (audioCtx.current) audioCtx.current.close();
                }
                return () => { if (audioCtx.current) audioCtx.current.close(); };
            }, [isActive]);

            useEffect(() => {
                const handleMouseMove = (e) => {
                    if (!isActive || !oscillator.current) return;
                    const freq = (e.clientX / window.innerWidth) * 200 + 40;
                    const res = (e.clientY / window.innerHeight) * 1000;
                    oscillator.current.frequency.setTargetAtTime(freq, audioCtx.current.currentTime, 0.1);
                    filter.current.frequency.setTargetAtTime(res, audioCtx.current.currentTime, 0.1);
                };
                window.addEventListener('mousemove', handleMouseMove);
                return () => window.removeEventListener('mousemove', handleMouseMove);
            }, [isActive]);
        };

        const TerminalLogin = ({ onLogin }) => {
            const [systemStarted, setSystemStarted] = useState(false);
            const [lines, setLines] = useState([]);
            const [input, setInput] = useState('');
            const [booting, setBooting] = useState(true);

            const bootSequence = [
                "> INITIALIZING NEBULA_OS v4.2...",
                "> ESTABLISHING QUANTUM LINK...",
                "> DECRYPTING INTERSTELLAR LOGS...",
                "> [!] ACCESS RESTRICTED: PILOT CREDENTIALS REQUIRED.",
                "> TYPE 'SCAN' TO COMMENCE MISSION."
            ];

            useEffect(() => {
                if (!systemStarted) return;
                let currentLine = 0;
                const timer = setInterval(() => {
                    if (currentLine < bootSequence.length) {
                        setLines(prev => [...prev, bootSequence[currentLine]]);
                        playMechanicalClick(300 + (currentLine * 50)); // Thuddier clicks
                        currentLine++;
                    } else {
                        setBooting(false);
                        clearInterval(timer);
                    }
                }, 800);
                return () => clearInterval(timer);
            }, [systemStarted]);

            const handleCommand = (e) => {
                if (e.key === 'Enter') {
                    playMechanicalClick(800);
                    if (input.toUpperCase() === 'SCAN') {
                        setLines(prev => [...prev, "> COMMAND ACCEPTED. ACCESSING NEBULA EXPLORER..."]);
                        setTimeout(() => onLogin(), 1000);
                    } else {
                        setLines(prev => [...prev, `> ERROR: UNKNOWN COMMAND '${input}'`]);
                        setInput('');
                    }
                }
            };

            if (!systemStarted) {
                return (
                    <div class="fixed inset-0 bg-black z-[300] flex flex-col items-center justify-center p-8 text-center">
                        <div class="hud-border p-12 max-w-lg w-full cursor-pointer hover:bg-cyan-900/10 transition-all group" onClick={() => {
                            setSystemStarted(true);
                            playMechanicalClick(500); 
                        }}>
                            <h1 class="text-3xl font-bold text-cyan-400 mb-4 tracking-widest uppercase animate-pulse">Nebula Explorer</h1>
                            <p class="text-xs text-cyan-800 mb-8 tracking-[0.3em]">SECURE UPLINK REQUIRED</p>
                            <div class="py-4 px-8 border-2 border-cyan-400 text-cyan-400 font-bold group-hover:bg-cyan-400 group-hover:text-black transition-all uppercase tracking-widest">
                                Initialize System
                            </div>
                        </div>
                        <p class="mt-8 text-[10px] text-slate-800 tracking-widest uppercase">System Auth v4.2.0 | Galactic Sector 7G</p>
                    </div>
                );
            }

            return (
                <div class="fixed inset-0 bg-black z-[300] p-8 terminal-font text-[#00ff41] flex flex-col justify-start overflow-hidden">
                    <div class="max-w-4xl mx-auto w-full">
                        <div class="space-y-2 mb-8">
                            {lines.map((line, i) => (
                                <p key={i} class="leading-relaxed animate-in fade-in slide-in-from-left duration-300">{line}</p>
                            ))}
                        </div>
                        {!booting && (
                            <div class="flex items-center gap-2">
                                <span>PILOT@NEBULA:~$</span>
                                <input 
                                    autoFocus
                                    class="bg-transparent border-none outline-none text-[#00ff41] w-full"
                                    value={input}
                                    onChange={e => {
                                        setInput(e.target.value);
                                        playMechanicalClick(400); // Thuddy keystroke
                                    }}
                                    onKeyDown={handleCommand}
                                />
                                <div class="cursor"></div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [audioActive, setAudioActive] = useState(false);
            const [discoveries, setDiscoveries] = useState([]);
            const [loading, setLoading] = useState(true);
            const [showForm, setShowForm] = useState(false);
            const [selectedPlanet, setSelectedPlanet] = useState(null);
            const [formData, setFormData] = useState({
                name: '', type: 'Terrestrial', distance: '', hazardLevel: 1, atmosphere: '', temperature: '', composition: '', description: '', image: 'exoplanet.png'
            });

            useInterstellarAudio(audioActive);

            useEffect(() => {
                if (isLoggedIn) fetchDiscoveries();
            }, [isLoggedIn]);

            useEffect(() => {
                if (selectedPlanet) speakMissionReport(selectedPlanet);
            }, [selectedPlanet]);

            const speakMissionReport = (planet) => {
                if (!window.speechSynthesis) return;
                window.speechSynthesis.cancel();
                const text = `Deep Scan complete. Planet ${planet.name} identified. It is a ${planet.type} world located ${planet.distance} light years from the core. Atmospheric conditions: ${planet.atmosphere || 'unstable or unknown'}. Surface temperature: ${planet.temperature || 'extreme or unmeasured'}. Chemical composition: ${planet.composition || 'unanalyzed'}. Hazard index is ${planet.hazardLevel} out of 10. ${planet.hazardLevel >= 8 ? 'Warning: Immediate danger protocol active.' : 'Mission parameters remain stable.'} Briefing: ${planet.description}`;
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.pitch = 0.85;
                utterance.rate = 0.95;
                window.speechSynthesis.speak(utterance);
            };

            const fetchDiscoveries = () => {
                fetch("/api/discoveries")
                    .then(res => res.json())
                    .then(data => { setDiscoveries(data); setLoading(false); })
                    .catch(err => console.error("Link Failure:", err));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                playMechanicalClick(600);
                fetch("/api/discoveries", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                })
                .then(res => res.json())
                .then(() => {
                    fetchDiscoveries();
                    setShowForm(false);
                    setFormData({ name: '', type: 'Terrestrial', distance: '', hazardLevel: 1, atmosphere: '', temperature: '', composition: '', description: '', image: 'exoplanet.png' });
                });
            };

            if (!isLoggedIn) return <TerminalLogin onLogin={() => setIsLoggedIn(true)} />;

            return (
                <div class="max-w-7xl mx-auto animate-in fade-in zoom-in duration-700">
                    <header class="hud-border p-6 mb-12 flex flex-col md:flex-row justify-between items-center rounded-sm border-b-4 border-r-4">
                        <div>
                            <h1 class="text-4xl font-bold tracking-widest text-cyan-400 uppercase glitch-text">Nebula Explorer</h1>
                            <p class="text-xs mt-1 text-cyan-600 font-bold uppercase tracking-widest">Quantum Frequency: {audioActive ? 'TUNED' : 'OFFLINE'}</p>
                        </div>
                        <div class="mt-4 md:mt-0 flex items-center gap-6">
                            <div class="flex items-center gap-3 border-r border-cyan-900 pr-6">
                                <span class="text-[10px] text-cyan-800 font-bold">AUDIO UPLINK</span>
                                <button 
                                    onClick={() => { playMechanicalClick(1000); setAudioActive(!audioActive); }}
                                    class={`w-12 h-6 rounded-full border border-cyan-400 p-1 transition-all ${audioActive ? 'bg-cyan-400' : 'bg-transparent'}`}
                                >
                                    <div class={`w-4 h-4 rounded-full transition-all ${audioActive ? 'bg-black translate-x-6' : 'bg-cyan-400'}`}></div>
                                </button>
                            </div>
                            <button 
                                onClick={() => { playMechanicalClick(500); setShowForm(!showForm); }}
                                class="hud-border px-6 py-2 bg-cyan-900/30 hover:bg-cyan-400 hover:text-black transition-all font-bold text-sm"
                            >
                                {showForm ? 'CLOSE LINK' : 'LOG NEW SIGNAL'}
                            </button>
                        </div>
                    </header>

                    {showForm && (
                        <div class="mb-12 hud-border p-8 rounded-sm border-l-4 border-cyan-400 animate-in fade-in slide-in-from-top duration-500">
                            <h2 class="text-xl mb-6 text-cyan-400 uppercase tracking-widest underline underline-offset-8 decoration-cyan-900">ENCODE SIGNAL DATA</h2>
                            <form onSubmit={handleSubmit} class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div class="space-y-4">
                                    <div>
                                        <label class="block text-[10px] mb-1 opacity-70 uppercase tracking-widest">Planet Name</label>
                                        <input required class="w-full p-2 outline-none bg-slate-900 border border-cyan-900 text-cyan-400" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} />
                                    </div>
                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-[10px] mb-1 opacity-70 uppercase tracking-widest">Sector Type</label>
                                            <select class="w-full p-2 outline-none text-xs bg-slate-900 border border-cyan-900 text-cyan-400" value={formData.type} onChange={e => setFormData({...formData, type: e.target.value})}>
                                                <option>Terrestrial</option><option>Gas Giant</option><option>Ice World</option><option>Oceanic</option><option>Volcanic</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label class="block text-[10px] mb-1 opacity-70 uppercase tracking-widest">Distance (LY)</label>
                                            <input type="number" required class="w-full p-2 outline-none bg-slate-900 border border-cyan-900 text-cyan-400" value={formData.distance} onChange={e => setFormData({...formData, distance: e.target.value})} />
                                        </div>
                                    </div>
                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-[10px] mb-1 opacity-70 uppercase tracking-widest">Atmosphere</label>
                                            <input class="w-full p-2 outline-none text-xs bg-slate-900 border border-cyan-900 text-cyan-400" value={formData.atmosphere} onChange={e => setFormData({...formData, atmosphere: e.target.value})} />
                                        </div>
                                        <div>
                                            <label class="block text-[10px] mb-1 opacity-70 uppercase tracking-widest">Temperature</label>
                                            <input class="w-full p-2 outline-none text-xs bg-slate-900 border border-cyan-900 text-cyan-400" value={formData.temperature} onChange={e => setFormData({...formData, temperature: e.target.value})} />
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-[10px] mb-1 opacity-70 uppercase tracking-widest">Composition</label>
                                        <input class="w-full p-2 outline-none text-xs bg-slate-900 border border-cyan-900 text-cyan-400" value={formData.composition} onChange={e => setFormData({...formData, composition: e.target.value})} />
                                    </div>
                                </div>
                                <div class="space-y-4">
                                    <div>
                                        <label class="block text-[10px] mb-1 opacity-70 uppercase tracking-widest">Hazard Level (1-10)</label>
                                        <input type="range" min="1" max="10" class="w-full accent-cyan-400" value={formData.hazardLevel} onChange={e => setFormData({...formData, hazardLevel: e.target.value})} />
                                    </div>
                                    <div>
                                        <label class="block text-[10px] mb-1 opacity-70 uppercase tracking-widest">Mission Description</label>
                                        <textarea rows="3" class="w-full p-2 outline-none text-xs bg-slate-900 border border-cyan-900 text-cyan-400" value={formData.description} onChange={e => setFormData({...formData, description: e.target.value})}></textarea>
                                    </div>
                                    <button class="w-full bg-cyan-400 text-black font-bold py-3 hover:bg-white transition-colors uppercase tracking-widest text-sm">Transmit Signal</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {loading ? (
                        <div class="flex justify-center p-20"><div class="w-12 h-12 border-4 border-cyan-400 border-t-transparent rounded-full animate-spin"></div></div>
                    ) : (
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            {discoveries.map(planet => (
                                <div key={planet._id} onClick={() => { playMechanicalClick(1100); setSelectedPlanet(planet); }} class={`planet-card hud-border rounded-sm border-t-2 border-r-2 group cursor-pointer ${planet.hazardLevel >= 8 ? 'border-red-500 shadow-[0_0_20px_rgba(239,68,68,0.2)]' : ''}`}>
                                    {planet.hazardLevel >= 8 && <div class="absolute top-0 left-0 w-full h-full pointer-events-none animate-pulse bg-red-500/5 z-0"></div>}
                                    <div class="h-48 overflow-hidden relative">
                                        <img src={planet.image} class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-700" />
                                        <div class="absolute inset-0 bg-gradient-to-t from-black to-transparent opacity-60"></div>
                                        <div class="absolute bottom-4 left-4">
                                            <span class={`text-[10px] px-2 py-0.5 font-bold uppercase ${planet.hazardLevel >= 8 ? 'bg-red-500 text-white' : 'bg-cyan-400 text-black'}`}>
                                                {planet.hazardLevel >= 8 ? '⚠️ EXTREME' : planet.type}
                                            </span>
                                        </div>
                                    </div>
                                    <div class="p-6 relative z-10">
                                        <div class="flex justify-between items-start mb-4">
                                            <h3 class={`text-2xl ${planet.hazardLevel >= 8 ? 'text-red-400' : 'text-cyan-400'}`}>{planet.name}</h3>
                                            <div class="text-right"><p class="text-[10px] opacity-50">DISTANCE</p><p class="text-sm font-bold text-white">{planet.distance} LY</p></div>
                                        </div>
                                        <p class="text-xs text-slate-400 mb-6 line-clamp-2 leading-relaxed">{planet.description}</p>
                                        <div class="space-y-2">
                                            <div class={`flex justify-between text-[8px] tracking-widest font-bold ${planet.hazardLevel >= 8 ? 'text-red-800' : 'text-cyan-800'}`}>
                                                <span>HAZARD INDEX</span><span>{planet.hazardLevel}/10</span>
                                            </div>
                                            <div class={`w-full bg-slate-900 rounded-full h-1 overflow-hidden border ${planet.hazardLevel >= 8 ? 'border-red-950' : 'border-cyan-950'}`}>
                                                <div class={`hazard-bar ${planet.hazardLevel >= 8 ? 'bg-gradient-to-r from-red-600 to-orange-500' : 'bg-gradient-to-r from-cyan-400 to-purple-600'}`} style={{ width: `${planet.hazardLevel * 10}%` }}></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {selectedPlanet && (
                        <div class="fixed inset-0 z-[200] flex items-center justify-center p-4 md:p-8 animate-in fade-in duration-300">
                            <div class="absolute inset-0 bg-black/95 backdrop-blur-xl" onClick={() => { setSelectedPlanet(null); window.speechSynthesis.cancel(); }}></div>
                            <div class="relative w-full max-w-4xl hud-border p-1 rounded-sm overflow-hidden bg-slate-950 border-cyan-400/50">
                                <div class="p-8 grid grid-cols-1 md:grid-cols-2 gap-12">
                                    <div class="space-y-8">
                                        <div class="relative group">
                                            <img src={selectedPlanet.image} class="w-full aspect-square object-cover border border-cyan-900" />
                                            <div class="absolute -top-2 -left-2 w-8 h-8 border-t-2 border-l-2 border-cyan-400"></div>
                                            <div class="absolute -bottom-2 -right-2 w-8 h-8 border-b-2 border-r-2 border-cyan-400"></div>
                                        </div>
                                        <div class="grid grid-cols-2 gap-4">
                                            <div class="hud-border p-4 bg-cyan-950/10 min-h-[100px] flex flex-col justify-center overflow-hidden">
                                                <p class="text-[10px] text-cyan-600 mb-1 tracking-widest uppercase">Atmosphere</p>
                                                <p class="text-[11px] font-bold text-cyan-100 uppercase leading-tight break-words">{selectedPlanet.atmosphere || 'UNKNOWN'}</p>
                                            </div>
                                            <div class="hud-border p-4 bg-cyan-950/10 min-h-[100px] flex flex-col justify-center overflow-hidden">
                                                <p class="text-[10px] text-cyan-600 mb-1 tracking-widest uppercase">Temperature</p>
                                                <p class="text-[11px] font-bold text-cyan-100 uppercase leading-tight break-words">{selectedPlanet.temperature || 'UNKNOWN'}</p>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="flex flex-col">
                                        <div class="flex justify-between items-start mb-8 border-b border-cyan-900 pb-4">
                                            <div><h2 class="text-4xl text-cyan-400 font-bold uppercase">{selectedPlanet.name}</h2><p class="text-xs text-cyan-700 tracking-[0.3em] uppercase mt-1">{selectedPlanet.type}</p></div>
                                            <button onClick={() => { setSelectedPlanet(null); window.speechSynthesis.cancel(); }} class="text-cyan-800 hover:text-white transition-colors">
                                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                            </button>
                                        </div>
                                        <div class="flex-1 space-y-6 overflow-y-auto pr-4 custom-scrollbar">
                                            <section><h4 class="text-[10px] text-cyan-600 mb-2 font-bold tracking-widest uppercase">Mission Briefing</h4><p class="text-sm leading-relaxed text-slate-300">{selectedPlanet.description}</p></section>
                                            <section><h4 class="text-[10px] text-cyan-600 mb-2 font-bold tracking-widest uppercase">Chemical Composition</h4><p class="text-sm text-white font-mono">{selectedPlanet.composition || 'UNANALYZED'}</p></section>
                                            <div class="mt-auto pt-8 flex justify-between items-end">
                                                <div class="space-y-1"><p class="text-[10px] text-cyan-800 uppercase">Distance From Core</p><p class="text-2xl font-bold text-white tracking-tighter">{selectedPlanet.distance} <span class="text-xs font-normal opacity-50">LY</span></p></div>
                                                <div class="text-right">
                                                    <p class="text-[10px] text-red-900 font-bold mb-1 uppercase">Hazard Rating</p>
                                                    <div class="flex gap-1">{[...Array(10)].map((_, i) => (<div key={i} class={`w-2 h-4 border ${i < selectedPlanet.hazardLevel ? 'bg-red-500 border-red-400' : 'bg-slate-900 border-slate-800'}`}></div>))}</div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    <footer class="mt-24 pb-8 text-center text-[10px] tracking-[0.5em] text-cyan-900 uppercase">End of Transmission | Secure Link Active</footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
